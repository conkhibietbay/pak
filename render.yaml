services:
  - type: web
    name: pak-admin
    runtime: node
    rootDir: .
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node ./server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: han_jeu
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pak-db
          property: connectionString

databases:
  - name: pak-db
    plan: free
    region: singapore
